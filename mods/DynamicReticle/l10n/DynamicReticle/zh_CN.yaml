"Dynamic Reticle and Hit Markers": "动态准星和命中标记"
"~~ Animated reticle, hit markers and enemy hp widget.": "~~ 动画准星、命中标记和敌人血条挂件。"

"Visuals": "视觉"
"Most of the settings below are not reflected in-game unless you run a 'reloadlua' command in console (~ console) or restart the game": "下方大部分设置更改后，需在控制台(~)输入'reloadlua'命令或重启游戏才能生效。"
"Reticle": "准星"
"Any image found in 'textures/dynamic reticle/reticles/' will be selectable here.": "位于'textures/dynamic reticle/reticles/'文件夹下的所有图像文件均可在此选择。"
"StealthArrows": "潜行箭头"
"Any image found in 'textures/dynamic reticle/stealth/' will be selectable here.": "位于'textures/dynamic reticle/stealth/'文件夹下的所有图像文件均可在此选择。"
"Reticle Color": "准星颜色"
"Reticle Opacity": "准星不透明度"
"Stowed Reticle Opacity": "收纳状态准星不透明度"
"Change reticle transparency to this value (0-1 range) when a weapon or spell is readied.": "当装备好武器或法术时，准星的不透明度(范围0-1)。"
"Missed Reticle Opacity": "未命中准星不透明度"
"Temporarily fades-out to this opacity level (0-1 range) when your attack misses.": "当你的攻击未命中时，暂时淡出至不透明度(范围0-1)。"
"Reticle Size Multiplier": "准星尺寸倍率"
"Reticle Sneak Scale": "潜行准星缩放"
"Adjust the size multiplier for the reticle when sneaking.": "调整潜行状态下准星的尺寸倍率。"
"HitMarker": "命中反馈"
"Any image found in 'textures/dynamic reticle/hitmarkers/' will be selectable here.": "位于'textures/dynamic reticle/hitmarkers/'文件夹下的所有图像文件均可在此选择。"
"Hit Marker Color": "命中反馈的颜色"
"Hit Marker Opacity": "命中反馈的不透明度"
"Weak Hit Marker Opacity": "弱效命中反馈的不透明度"
"Weak hitmarkers are only used by CHIM2090 combat mod": "弱效命中反馈仅在配合CHIM2090战斗模组时生效。"
"Hit Marker Size Multiplier": "命中反馈的尺寸倍率"
"Kill Marker Color": "击杀反馈的颜色"
"Slowdown On Kill Chance": "击杀时触发慢动作概率"
"A Chance that a slowdown effect will happen on kill. 0-1 range.": "击杀敌人时触发慢动作效果的概率(范围0-1)。"
"Slowdown On Kill Duration": "击杀时慢动作时长"
"An overall slowdown duration multiplier.": "慢动作持续时间的总倍率。"
"Show Enemy HP Widget": "显示敌人的血条挂件"
"Displays a subtle enemy hp widget under the reticle in combat.": "战斗中在准星下方显示一个精简的敌人生命值条。"
"Hp Widget Color": "血条挂件的颜色"
"Hp Widget Opacity": "血条挂件的不透明度"
"Hp Widget Damage Color": "血条挂件的扣血颜色"
"Hp Widget Size Multiplier": "血条挂件的缩放倍率"

"Sound": "音效"
"A bit of oomph": "给打击感加点料"
"HitMarkerSound": "命中反馈的音效"
"DeathMarkerSound": "击杀反馈的音效"
"Any sound found in 'sounds/dynamic reticle/hitmarkers/' will be selectable here.": "位于'sounds/dynamic reticle/hitmarkers/'文件夹下的所有音效文件均可在此选择。"
"Hit Marker Sound Volume": "命中反馈的音量"
"Death Marker Sound Volume": "击杀反馈的音量"
"Min Sound Pitch": "最小音高"
"Minimum value of a randomised pitch. 1.0 = no pitch change. Affects both hit and kill marker sounds.": "随机音高的最小值。1.0 = 无音高变化。影响命中和击杀标记音效。"
"Max Sound Pitch": "最大音高"
"Maximum value of a randomised pitch. 1.0 = no pitch change. Affects both hit and kill marker sounds.": "随机音高的最大值。1.0 = 无音高变化。影响命中和击杀标记音效。"
"Play hit sound with Melee weapons": "开启近战武器的命中音效"
"Play hit sound with Marksman weapons": "开启远程武器的命中音效"
"Play hit sound with spell casting": "开启法术施放的命中音效"
