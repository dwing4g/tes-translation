blending_rules:
  - from: "*"
    to: "idle"
    easing: "sineOut"
    duration: 0.4
  - from: "arms*"
    to: "idle"
    easing: "sineInOut"
    duration: 0.7
  - from: "handhippose:*"
    to: "idle"
    easing: "sineInOut"
    duration: 1.2
  - from: "pose*"
    to: "idle"
    easing: "sineInOut"
    duration: 0.7
  - from: "idle2*"
    to: "idle"
    easing: "sineInOut"
    duration: 0.7
  - from: "readypose"
    to: "idle"
    easing: "sineInOut"
    duration: 0.5
  - from: "gv*"
    to: "idle"
    easing: "sineInOut"
    duration: 0.7
