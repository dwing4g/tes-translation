ConfigTitle: Magic Window Extender
ConfigSummary: |-
  A Lua replacement for the magic window, with built-in tweaks and an API for other mods to add their own content.
  --- v%{version} ---

ConfigCategoryKeybinds: Keybinds
ToggleMagicWindow1: Toggle Magic Window
ToggleMagicWindow2: Toggle Magic Window (alt.)

RequiresReload: Requires a Lua reload to take effect.

ConfigCategoryWindowOptions: Window Options
ReplaceVanillaWindow: Replace vanilla window
ReplaceVanillaWindowDesc: |-
  Replace the game's built-in magic window.
  If disabled, you can still access the extended window via the keybind.
  Does not work with controller menus enabled.
TextSizeOverride: Text size override
TextSizeOverrideDesc: |-
  Override the default text size used in the magic window. 
  Set to 0 to use the game's default size.
MagicWindowPinned: Magic window pinned
MagicWindowDimensions: Magic window dimensions

ConfigCategoryTweaks: Tweaks
TweakSpellIcons: Spell icons
TweakSpellIconsDesc: |-
  Show icons next to entries in the spell list.
TweakSchoolFilter: School filtering
TweakSchoolFilterDesc: |-
  Add a button bar to filter spells by school.
TweakColoredSchoolIcons: Colored school icons
TweakColoredSchoolIconsDesc: |-
  Replace the monochrome vanilla school icons with colored versions to differentiate them in the filter bar.
  You may want to disable this if you are already using an icon replacer pack.
TweakListEditing: List editing
TweakListEditingDesc: |-
  Add a button to select spells to pin or hide from the list.
TweakSmartSpellCycling: Smart spell cycling
TweakSmartSpellCyclingDesc: |-
  The next/previous spell hotkeys will respect the actual order of your spell list, including pinned and hidden spells and any active filters.
TweakSeparatePinnedSpells: Separate pinned spells
TweakSeparatePinnedSpellsDesc: |-
  Pinned spells will be visually separated by a divider from the rest of the spell list.
TweakPinnedSpellIcons: Pinned spell icons
TweakPinnedSpellIconsDesc: |-
  Pinned spells will be marked with a bookmark icon in the spell list.
TweakMarkUsedPowers: Mark used powers
TweakMarkUsedPowersDesc: |-
  Powers that have been used today will be grayed out and marked with "Used" in the spell list.
TweakSearchBarOnTop: Search bar on top
TweakSearchBarOnTopDesc: |-
  Move the bottom bar (search, filter, etc.) to the top of the window.
TweakDeleteButtonStyle: Delete button style
TweakDeleteButtonStyleDesc: |-
  Choose the style of the delete button, or disable it entirely.
  If disabled, you can still delete spells by shift-clicking them in the list.
TweakDeleteButtonStyle_Icon: Icon
TweakDeleteButtonStyle_Text: Text
TweakDeleteButtonStyle_Disabled: Disabled
TweakHideSpellCostChance: Hide spell cost/chance
TweakHideSpellCostChanceDesc: |-
  Hide the cost and chance information for spells in the spell list.
  This info will be moved to the tooltip instead.
TweakHideItemCostCharge: Hide item cost/charge
TweakHideItemCostChargeDesc: |-
  Hide the cost and charge information for magic items in the spell list.
  This info will be moved to the tooltip instead.

ConfigCategoryModIntegration: Mod Integrations
InterfaceReimagined: Interface Reimagined support
InterfaceReimaginedDesc: |-
  Adjust appearance to better fit the style of Interface Reimagined.
CustomSpellIconStyle: Custom spell icon style
CustomSpellIconStyleDesc: |-
  Magic Window Extender comes with custom effect tooltips for some spell mods.
  Icons are provided for each in two styles.
  Choose the style that best fits your setup.
CustomSpellIconStyle_Flat: Flat
CustomSpellIconStyle_Textured: Textured

ConfigCategoryMisc: Miscellaneous
ShowControllerWarning: Show controller warning
ShowControllerWarningDesc: |-
  Show a warning message if controller menus are enabled, since the window replacer is not compatible with them.

PowerUsed: Used
FilterBySchool: "Filter by school: {school}"


DeleteSpellInstruction: "To delete {spellName}, open your console and copy-paste the command below."