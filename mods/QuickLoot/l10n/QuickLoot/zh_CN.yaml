"can loot during death animation": "死亡动画过程中可以搜刮"
"The engine only runs on-death scripts once the animation stops, looting before that can hand you equipment a mod was about to strip from the corpse\noff: wait for the animation to end\nnear the end: open at 55% of the animation\nimmediately: open the moment it dies": "引擎只在死亡动画停止后才运行死亡脚本，在此之前搜刮可能会拿到模组即将从尸体上移除的装备\n关：等待动画结束\n接近结束时：在动画55%时打开\n立即：死亡瞬间打开"
